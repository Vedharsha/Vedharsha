<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C29"/>
      <stop offset="50%" stop-color="#24243e"/>
      <stop offset="100%" stop-color="#302B63"/>
    </linearGradient>

    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B9AEFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B9AEFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B9AEFF" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8E3FF"/>
      <stop offset="100%" stop-color="#B9AEFF"/>
    </linearGradient>

    <filter id="blur1"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <!-- background -->
  <rect width="900" height="230" fill="url(#bg)"/>

  <!-- floating orbs: purely decorative, safe if animation is unsupported -->
  <circle cx="120" cy="60" r="90" fill="url(#orb1)" filter="url(#blur1)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 30,18; 0,0" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="800" cy="170" r="110" fill="url(#orb2)" filter="url(#blur2)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -25,-15; 0,0" dur="11s" repeatCount="indefinite"/>
  </circle>

  <circle cx="700" cy="40" r="55" fill="url(#orb1)" filter="url(#blur1)" opacity="0.7">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -18,20; 0,0" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling dots: default fully visible, twinkle is a bonus, never breaks layout -->
  <g fill="#E8E3FF">
    <circle cx="60" cy="180" r="2.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="35" r="1.8"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="20" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="150" r="1.6"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="60" r="2.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.9s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="190" r="1.7"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="3.1s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name: always fully visible, no animation dependency -->
  <text x="450" y="105" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif"
        font-size="46" font-weight="700" fill="url(#nameGrad)" letter-spacing="2">
    VEDHARSHA V
  </text>

  <!-- single static tagline: always legible regardless of animation support -->
  <text x="450" y="150" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace"
        font-size="19" fill="#B9AEFF">
    Java &amp; Spring Boot Developer · Full-Stack Builder · ML/CV Explorer
  </text>

  <!-- blinking cursor: harmless if static, just reads as a small tick mark -->
  <rect x="726" y="136" width="3" height="20" fill="#E8E3FF">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- animated wave along the bottom -->
  <path fill="url(#wave)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,210 C150,190 300,230 450,210 C600,190 750,230 900,210 L900,230 L0,230 Z;
        M0,215 C150,235 300,195 450,215 C600,235 750,195 900,215 L900,230 L0,230 Z;
        M0,210 C150,190 300,230 450,210 C600,190 750,230 900,210 L900,230 L0,230 Z
      "/>
  </path>
</svg>
