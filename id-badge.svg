<svg width="260" height="420" viewBox="0 0 260 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241708"/>
      <stop offset="100%" stop-color="#150F0B"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2711D"/>
      <stop offset="100%" stop-color="#F1C36B"/>
    </linearGradient>
    <style>
      .sans{font-family:'Trebuchet MS',Verdana,sans-serif;}
      .mono{font-family:'Courier New',monospace;}
      .swing{
        transform-origin: 130px 26px;
        animation: sway 4.5s ease-in-out infinite;
      }
      @keyframes sway{
        0%,100%{transform:rotate(-3.2deg);}
        50%{transform:rotate(3.2deg);}
      }
      .pulse{animation:pulse 1.8s ease-in-out infinite;}
      @keyframes pulse{
        0%,100%{opacity:1; r:4;}
        50%{opacity:0.4; r:5.5;}
      }
    </style>
  </defs>

  <g class="swing">
    <!-- lanyard strap -->
    <line x1="110" y1="0" x2="130" y2="60" stroke="#3A2A16" stroke-width="10" stroke-linecap="round"/>
    <line x1="150" y1="0" x2="130" y2="60" stroke="#3A2A16" stroke-width="10" stroke-linecap="round"/>
    <rect x="118" y="46" width="24" height="16" rx="4" fill="#7C6A54"/>
    <circle cx="130" cy="66" r="6" fill="#7C6A54"/>

    <!-- card -->
    <g transform="translate(20,64)">
      <rect x="0" y="0" width="220" height="300" rx="16" fill="url(#cardBg)" stroke="#3A2A16" stroke-width="2"/>
      <rect x="0" y="0" width="220" height="14" rx="7" fill="url(#stripe)"/>

      <circle cx="110" cy="92" r="46" fill="#20160C" stroke="#E8A93A" stroke-width="2.5"/>
      <text x="110" y="104" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="#F1C36B">VV</text>

      <text x="110" y="168" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#F5EFE6">Vedharsha V</text>
      <text x="110" y="190" text-anchor="middle" class="mono" font-size="12.5" fill="#D9CBB8">Java · Spring Boot · Full-Stack</text>

      <g transform="translate(60,216)">
        <circle cx="0" cy="0" r="4" fill="#3FA796" class="pulse"/>
        <text x="12" y="4" class="mono" font-size="11" fill="#9FAFA9">STATUS: BUILDING</text>
      </g>

      <g transform="translate(24,248)" stroke="#3A2A16" stroke-width="3">
        <line x1="0" y1="0" x2="0" y2="26"/>
        <line x1="8" y1="0" x2="8" y2="26"/>
        <line x1="14" y1="0" x2="14" y2="26"/>
        <line x1="24" y1="0" x2="24" y2="26"/>
        <line x1="34" y1="0" x2="34" y2="26"/>
        <line x1="40" y1="0" x2="40" y2="26"/>
        <line x1="50" y1="0" x2="50" y2="26"/>
        <line x1="58" y1="0" x2="58" y2="26"/>
        <line x1="66" y1="0" x2="66" y2="26"/>
        <line x1="76" y1="0" x2="76" y2="26"/>
        <line x1="84" y1="0" x2="84" y2="26"/>
        <line x1="92" y1="0" x2="92" y2="26"/>
        <line x1="100" y1="0" x2="100" y2="26"/>
        <line x1="110" y1="0" x2="110" y2="26"/>
        <line x1="120" y1="0" x2="120" y2="26"/>
        <line x1="130" y1="0" x2="130" y2="26"/>
        <line x1="140" y1="0" x2="140" y2="26"/>
        <line x1="150" y1="0" x2="150" y2="26"/>
        <line x1="158" y1="0" x2="158" y2="26"/>
        <line x1="166" y1="0" x2="166" y2="26"/>
        <line x1="172" y1="0" x2="172" y2="26"/>
      </g>
    </g>
  </g>
</svg>
